[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "deskbuddy"
version = "0.1.0"
description = "A visual robotics workbench for SO-101 kinematics, motion planning and learned grasp experiments"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["numpy>=2,<2.3", "scipy>=1.14", "Pillow>=10"]

[project.optional-dependencies]
camera = ["pyrealsense2>=2.56", "opencv-python>=4.10", "cv2-enumerate-cameras==1.4.0"]
robot = ["lerobot[feetech]==0.7.0"]
flow = ["torch>=2.7"]
perception = ["ultralytics==8.4.219", "opencv-python==4.13.0.92"]
viz = ["plotly>=6", "matplotlib>=3.10"]
simulation = ["mujoco==4.0.1"]
dev = ["pytest>=8", "ruff==0.17.6"]

[project.scripts]
deskbuddy = "deskbuddy.cli:main"

[project.urls]
Repository = "https://github.com/AmirRoshankar/DeskBuddy"
Issues = "https://github.com/AmirRoshankar/DeskBuddy/issues"

[tool.setuptools.package-data]
deskbuddy = ["models/*.urdf", "models/*.npz", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
