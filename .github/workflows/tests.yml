name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    name: Offline tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[dev,simulation]" opencv-python build
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - if: runner.os == 'Windows'
        run: python -m pytest -q
      - run: python -m deskbuddy demo --headless --output runs/ci-demo
      - run: python -m build --wheel
